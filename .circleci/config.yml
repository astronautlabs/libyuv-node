# kick: 0

version: 2.1

orbs:
  win: circleci/windows@5.1.1

commands:
  run_tests_windows:
    description: "Build libyuv-node and run the test suite"
    parameters:
      version:
        description: Node.js version to test with
        type: string
    steps:
      - run: choco install cmake wget -y
      - run: choco install nodejs --version=<< parameters.version>>
      - run_tests:
          version: << parameters.version >>
          os: "windows"
  run_tests_linux:
    description: "Build libyuv-node and run the test suite"
    parameters:
      version:
        description: Node.js version to test with
        type: string
    steps:
      - run: sudo apt update && sudo apt install cmake
      - run_tests:
          version: << parameters.version >>
          os: "linux"
  run_tests:
    description: "Build libyuv-node and run the test suite"
    parameters:
      version:
        type: string
      os:
        type: string
    steps:
      - checkout
      - restore_cache:
          keys:
          - v2-dependencies-<< parameters.os >>-<< parameters.version >>-{{ checksum "package.json" }}
          - v2-dependencies-<< parameters.os >>-<< parameters.version >>-
      - run: npm install
      - save_cache:
          paths:
            - node_modules
          key: v2-dependencies-<< parameters.os >>-<< parameters.version >>-{{ checksum "package.json" }}
      - run: npm test
jobs:
  windows-node-26:
    executor:
      name: win/default
      size: medium
    steps:
      - run_tests_windows:
          version: "26.5.0"
  linux-node-26:
    docker:
      - image: cimg/node:26.5
    working_directory: ~/repo
    steps:
      - run_tests_linux:
          version: "26.5"
  linux-node-22:
    docker:
      - image: cimg/node:22.23
    working_directory: ~/repo
    steps:
      - run_tests_linux:
          version: "22.23"
  linux-node-18:
    docker:
      - image: cimg/node:18.20
    working_directory: ~/repo
    steps:
      - run_tests_linux:
          version: "18.20"

workflows:
  build:
    jobs:
      - windows-node-26
      - linux-node-26
      - linux-node-22
      - linux-node-18
